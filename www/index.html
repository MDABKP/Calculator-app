<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1c1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ক্যালকুলেটর</title>
<style>
:root{--bg:#1b1c1f;--panel:#2b2c30;--key:#3a3b40;--txt:#f4f4f4;--dim:#9a9ba0;--acc:#f5900a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:"Roboto","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.disp{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 22px 16px;background:var(--panel);border-radius:0 0 28px 28px}
.mem{height:30px;font-size:22px;color:var(--dim);white-space:nowrap;overflow:hidden}
.sub{text-align:right;white-space:nowrap;overflow-x:auto;overflow-y:hidden;font-size:30px;color:var(--dim);height:48px;line-height:40px;margin-top:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.sub::-webkit-scrollbar{display:none}
.main{text-align:right;white-space:nowrap;overflow-x:auto;overflow-y:hidden;font-size:76px;font-weight:500;line-height:1.15;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:9px;padding:12px 10px calc(12px);height:60%;box-sizing:border-box}
button{border:0;margin:0;padding:0;background:var(--key);color:var(--txt);font:inherit;font-size:34px;border-radius:16px;cursor:pointer}
button:active{filter:brightness(1.4)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:-3px}
.a{color:var(--acc)}
.m{font-size:28px;background:var(--m);color:var(--dim)}
.eq{background:var(--acc);color:#fff}
.tall{grid-row:span 2}
.main::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;height:36px;flex:none}
.top .mem{flex:1}
.hbtn{background:transparent;color:var(--dim);width:44px;height:36px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.hbtn.on{color:var(--acc)}
.hist{flex:1;min-height:0;overflow-y:auto;margin:4px -22px 6px;scrollbar-width:none;touch-action:pan-y}
.hist::-webkit-scrollbar{display:none}
.hw{position:relative;min-height:100%}
.hw::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:var(--acc)}
.ent{position:relative;padding:8px 22px 10px;border-bottom:1px solid #3d3e43;cursor:pointer}
.hrow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--dim);text-transform:uppercase}
.hrow .t{font-weight:400;opacity:.7}
.ic{display:flex;background:var(--panel);color:var(--acc);border-radius:50%}
.ic svg{width:30px;height:30px}
.hr{text-align:right;font-size:30px;color:var(--acc);word-break:break-all;margin:-4px 0 0 42px}
.he{text-align:right;font-size:20px;color:var(--dim);word-break:break-all;margin-left:42px}
.hempty{padding:30px;text-align:center;color:var(--dim)}
.hclr{display:block;margin:12px auto 8px;position:relative;background:var(--panel);color:var(--dim);font-size:15px;padding:6px 14px;border-radius:12px;border:1px solid #4a4b50}
.disp.open .sub{display:none}
:root{--m:#313236;--line:#3d3e43}
html[data-theme=light]{--bg:#eceef2;--panel:#fff;--key:#fff;--txt:#17181b;--dim:#6b6d74;--m:#e3e5ea;--line:#d6d8de;color-scheme:light}
.hbtn{font-size:24px}
button{transition:background .25s}
.flash{background:var(--acc)!important;color:#fff!important}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden],.pop[hidden]{display:none}
.card{width:100%;max-width:480px;background:var(--panel);border-radius:24px 24px 0 0;padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px))}
.card h3{margin:0 0 6px;font-weight:500}
.card label,.card .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:17px;border-bottom:1px solid var(--line)}
.card input{width:22px;height:22px;accent-color:var(--acc)}
.sheet button{font-size:16px;padding:8px 14px;margin-left:6px;border-radius:12px}
.sheet button.on{background:var(--acc);color:#fff}
.sw{display:flex}
.sw button{width:30px;height:30px;padding:0;border-radius:50%;margin-left:8px;border:2px solid transparent}
.sw button.on{border-color:var(--txt)}
.sheet .done{display:block;width:100%;margin:16px 0 0;background:var(--acc);color:#fff}
.pop{position:fixed;z-index:15;display:flex;background:var(--key);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.5);transform:translateX(-50%)}
.pop button{font-size:16px;padding:10px 18px;background:transparent;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.sub{border-bottom:1px solid rgba(128,128,128,.55)}
.main{padding-top:6px}
.disp.open .main{border-top:1px solid rgba(128,128,128,.55)}
.card input[type=range]{width:55%;height:auto}
.ghost{position:fixed;z-index:12;pointer-events:none;text-align:right;white-space:nowrap;overflow:hidden;box-sizing:border-box;animation:flyup .45s ease-in forwards}
@keyframes flyup{to{transform:translateY(-120px);opacity:0}}
.rise{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(26px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ghost,.rise{animation:none}.ghost{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="disp" id="disp">
    <div class="top"><div class="mem" id="mem"></div><button class="hbtn" id="sbtn" aria-label="সেটিংস"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="hbtn" id="hbtn" aria-label="হিস্ট্রি"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button></div>
    <div class="hist" id="hist" hidden></div>
    <div class="sub" id="sub"></div>
    <div class="main" id="main">0</div>
  </div>
  <div class="pad" id="pad">
    <button class="m" data-k="mc">mc</button><button class="m" data-k="m+">m+</button><button class="m" data-k="m-">m-</button><button class="m" data-k="mr">mr</button>
    <button class="a" data-k="C">C</button><button class="a" data-k="÷">÷</button><button class="a" data-k="×">×</button><button data-k="back" aria-label="মুছুন">⌫</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="a" data-k="−">−</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="a tall" data-k="+">+</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="%">%</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="card">
<h3>সেটিংস</h3>
<label><span>শব্দ</span><input type="checkbox" id="s_snd"></label>
<div class="row"><span>শব্দের ধরন</span><div><button data-st="click">ক্লিক</button><button data-st="tick">টিক</button><button data-st="pop">পপ</button></div></div>
<div class="row"><span>ভলিউম</span><input type="range" id="s_vol" min="5" max="100" step="5"></div>
<label><span>কম্পন</span><input type="checkbox" id="s_vib"></label>
<label><span>কি চাপলে রঙের ঝলক</span><input type="checkbox" id="s_flash"></label>
<div class="row"><span>থিম</span><div><button data-th="dark">ডার্ক</button><button data-th="light">লাইট</button></div></div>
<div class="row"><span>রং</span><div class="sw" id="sw"></div></div>
<button class="done" id="s_close">ঠিক আছে</button>
</div></div>
<div class="pop" id="pop" hidden><button data-p="copy">কপি</button><button data-p="paste">পেস্ট</button></div>
<div class="toast" id="toast"></div>
<script>
var expr="",lastExpr="",done=false,memory=0,histOpen=false,hist=[];
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
var sm=parseFloat(load("calc_mem"));if(!isNaN(sm))memory=sm;
function fmtNum(s){var p=s.split(".");p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");return p.join(".")}
function fmtExpr(e){return e.replace(/\d+\.?\d*|\.\d+/g,fmtNum).replace(/([+×÷−])/g," $1 ").replace(/\(\s*−/g,"(−").replace(/^\s*−\s*/,"−").trim()}
function fmtVal(n){if(!isFinite(n))return "ত্রুটি";var s=String(parseFloat(n.toPrecision(12)));if(/e/.test(s))return s;return fmtNum(s).replace("-","−")}
function evalExpr(e){
  var t=e.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  t=t.replace(/(\d+\.?\d*|\.\d+|\))%/g,"($1/100)");
  t=t.replace(/[+\-*\/.(]+$/,"");
  if(!t||!/^[\d+\-*\/.()\s]+$/.test(t))return null;
  try{var v=Function('"use strict";return ('+t+')')();return typeof v==="number"?v:null}catch(err){return null}
}
function current(){var v=evalExpr(expr);return v===null?0:v}
function lastNum(){var m=expr.match(/\d+\.?\d*$|\.\d*$/);return m?m[0]:null}
function render(){
  document.getElementById("mem").textContent=memory!==0?"m "+fmtVal(memory):"";
  var sub=document.getElementById("sub"),main=document.getElementById("main");
  if(done){sub.textContent=fmtExpr(lastExpr);main.textContent=fmtVal(parseFloat(expr.replace("−","-")))}
  else{
    sub.textContent=expr===""?"":fmtExpr(expr);
    if(expr==="")main.textContent="0";
    else if(/^\d*\.?\d*$/.test(expr)){main.textContent=fmtNum(expr)}
    else{var v=evalExpr(expr);main.textContent=v===null?"0":fmtVal(v)}
  }
  fit();
}
function fitEl(el,max,min){var size=max;el.style.fontSize=size+"px";
  while(el.scrollWidth>el.clientWidth&&size>min){size-=1;el.style.fontSize=size+"px"}}
function fit(){var m=document.getElementById("main");fitEl(m,histOpen?48:76,36);m.scrollLeft=m.scrollWidth;var s=document.getElementById("sub");s.scrollLeft=s.scrollWidth}
function press(k){
  var isOp=/^[+×÷−]$/.test(k);
  if(done){if(/^[\d.]$/.test(k)||k==="mr")expr="";done=false}
  if(/^\d$/.test(k)){expr+=k}
  else if(k==="."){var ln=lastNum();if(ln===null||ln.indexOf(".")<0)expr+=(ln===null?"0.":".")}
  else if(isOp){
    if(expr===""){if(k==="−")expr="−"}
    else if(/[+×÷−]$/.test(expr)){expr=expr.slice(0,-1)+k}
    else expr+=k;
  }
  else if(k==="%"){if(/\d$/.test(expr))expr+="%"}
  else if(k==="C"){expr="";lastExpr=""}
  else if(k==="back"){expr=expr.slice(0,-1)}
  else if(k==="="){var v=evalExpr(expr);if(v!==null&&/[+×÷−%]/.test(expr)){lastExpr=expr;expr=String(parseFloat(v.toPrecision(12))).replace("-","−");done=true;addHist(lastExpr,expr)}}
  else if(k==="mc"){memory=0;save("calc_mem",0)}
  else if(k==="m+"){memory=parseFloat((memory+current()).toPrecision(15));save("calc_mem",memory)}
  else if(k==="m-"){memory=parseFloat((memory-current()).toPrecision(15));save("calc_mem",memory)}
  else if(k==="mr"){var s=String(Math.abs(memory));var tn=expr.match(/\d+\.?\d*%?$|\.\d*$/);if(tn)expr=expr.slice(0,tn.index);expr+=memory<0?"−"+s:s}
  render();
}
try{hist=JSON.parse(load("calc_hist")||"[]")}catch(e){hist=[]}
if(!Array.isArray(hist))hist=[];
var CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
function addHist(e,r){hist.push({e:e,r:r,t:Date.now()});if(hist.length>200)hist.shift();save("calc_hist",JSON.stringify(hist));if(histOpen)renderHist()}
function renderHist(){
  var h=document.getElementById("hist"),s='<div class="hw">';
  if(!hist.length)s+='<div class="hempty">এখনো কোনো হিস্ট্রি নেই</div>';
  hist.forEach(function(it,i){
    var d=new Date(it.t),now=new Date();
    var dt=d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+(d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():"");
    var tm=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    s+='<div class="ent" data-i="'+i+'"><div class="hrow"><span class="ic">'+CLOCK+'</span><span>'+dt+'</span><span class="t">'+tm+'</span></div><div class="hr">'+fmtVal(parseFloat(String(it.r).replace("−","-")))+'</div><div class="he">'+fmtExpr(it.e)+'</div></div>';
  });
  if(hist.length)s+='<button class="hclr" data-clr="1">হিস্ট্রি মুছুন</button>';
  h.innerHTML=s+'</div>';h.scrollTop=h.scrollHeight;
}
function toggleHist(){
  histOpen=!histOpen;
  document.getElementById("disp").classList.toggle("open",histOpen);
  document.getElementById("hbtn").classList.toggle("on",histOpen);
  document.getElementById("hist").hidden=!histOpen;
  if(histOpen)renderHist();
  fit();
}
document.getElementById("hbtn").addEventListener("click",toggleHist);
document.getElementById("hist").addEventListener("click",function(e){
  if(e.target.closest("[data-clr]")){hist=[];save("calc_hist","[]");renderHist();return}
  var n=e.target.closest(".ent");if(!n)return;
  var it=hist[+n.dataset.i];if(!it)return;
  lastExpr=it.e;expr=String(it.r);done=true;toggleHist();render();
});
document.getElementById("pad").addEventListener("click",function(e){var b=e.target.closest("button");if(b){fb(b);if(b.dataset.k==="C")swipeAway();press(b.dataset.k)}});
render();
var S={snd:true,st:"click",vol:60,vib:true,flash:true,th:"dark",acc:"#f5900a"},ACCS=["#f5900a","#3a9bff","#2ecc71","#e84a8a","#f1c40f","#9b6bff"],actx=null;
try{Object.assign(S,JSON.parse(load("calc_set")||"{}"))}catch(e){}
function $(i){return document.getElementById(i)}
function applySet(){var r=document.documentElement;r.setAttribute("data-theme",S.th);r.style.setProperty("--acc",S.acc);save("calc_set",JSON.stringify(S));
 $("s_snd").checked=S.snd;$("s_vib").checked=S.vib;$("s_flash").checked=S.flash;$("s_vol").value=S.vol;document.querySelectorAll("[data-st]").forEach(function(b){b.classList.toggle("on",b.dataset.st===S.st)});
 document.querySelectorAll("[data-th]").forEach(function(b){b.classList.toggle("on",b.dataset.th===S.th)});
 document.querySelectorAll("[data-c]").forEach(function(b){b.classList.toggle("on",b.dataset.c===S.acc)})}
ACCS.forEach(function(c){var b=document.createElement("button");b.dataset.c=c;b.style.background=c;$("sw").appendChild(b)});
$("sbtn").addEventListener("click",function(){$("sheet").hidden=false});
$("sheet").addEventListener("click",function(e){var t=e.target;
 if(t.id==="sheet"||t.id==="s_close")$("sheet").hidden=true;
 var th=t.closest("[data-th]"),c=t.closest("[data-c]"),st=t.closest("[data-st]");if(st){S.st=st.dataset.st;applySet();if(S.snd)beep()}
 if(th){S.th=th.dataset.th;applySet()}if(c){S.acc=c.dataset.c;applySet()}});
$("sheet").addEventListener("change",function(){S.snd=$("s_snd").checked;S.vib=$("s_vib").checked;S.flash=$("s_flash").checked;S.vol=+$("s_vol").value;applySet();if(S.snd)beep()});
applySet();
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),T=S.st,v=Math.max(0.001,S.vol/100*0.35)*(T==="click"?0.5:1),d=T==="tick"?0.02:T==="pop"?0.07:0.04;
 o.type=T==="click"?"square":"sine";
 o.frequency.setValueAtTime(T==="tick"?1800:T==="pop"?450:700,t);
 if(T==="pop")o.frequency.exponentialRampToValueAtTime(160,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.01)}catch(e){}}
function swipeAway(){
 ["sub","main"].forEach(function(id){var el=$(id),t=el.textContent;if(!t)return;
  var r=el.getBoundingClientRect(),cs=getComputedStyle(el),g=document.createElement("div");
  g.textContent=t;g.className="ghost";
  g.style.cssText="left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px;font-size:"+cs.fontSize+";font-weight:"+cs.fontWeight+";line-height:"+cs.lineHeight+";padding-top:"+cs.paddingTop+";color:"+cs.color;
  document.body.appendChild(g);setTimeout(function(){g.remove()},500)});
 var m=$("main");m.classList.remove("rise");void m.offsetWidth;m.classList.add("rise");
}
function fb(btn){
 if(S.vib&&navigator.vibrate){try{navigator.vibrate(12)}catch(e){}}
 if(S.snd)beep();
 if(S.flash&&btn){btn.classList.add("flash");setTimeout(function(){btn.classList.remove("flash")},120)}
}
var lp=null,lx=0,ly=0,mainEl=$("main"),pop=$("pop"),BN="০১২৩৪৫৬৭৮৯";
function clr(){if(lp){clearTimeout(lp);lp=null}}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},1500)}
function oldCopy(t){try{var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=document.execCommand("copy");document.body.removeChild(a);return ok}catch(e){return false}}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){return true},function(){return oldCopy(t)})}return Promise.resolve(oldCopy(t))}
function pasteNum(s){
 s=String(s).replace(/[০-৯]/g,function(c){return BN.indexOf(c)}).replace(/,/g,"");
 var m=s.match(/-?\d+\.?\d*|-?\.\d+/);if(!m){toast("সংখ্যা পাওয়া যায়নি");return}
 var n=m[0],neg=n[0]==="-";if(neg)n=n.slice(1);if(n[0]===".")n="0"+n;
 if(done){expr="";done=false}
 var tn=expr.match(/\d+\.?\d*%?$|\.\d*$/);if(tn)expr=expr.slice(0,tn.index);
 if(neg)n=/[+×÷−]$/.test(expr)?"(−"+n+")":"−"+n;
 expr+=n;render();toast("পেস্ট হয়েছে")}
function askPaste(){var v=window.prompt("সংখ্যাটি এখানে পেস্ট করুন");if(v)pasteNum(v)}
function showPop(){var r=mainEl.getBoundingClientRect();pop.style.left=Math.max(80,Math.min(window.innerWidth-80,lx))+"px";pop.style.top=Math.max(8,r.top-52)+"px";pop.hidden=false;try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
mainEl.addEventListener("pointerdown",function(e){lx=e.clientX;ly=e.clientY;clr();lp=setTimeout(function(){lp=null;showPop()},500)});
["pointerup","pointercancel","pointerleave"].forEach(function(t){mainEl.addEventListener(t,clr)});
mainEl.addEventListener("pointermove",function(e){if(Math.abs(e.clientX-lx)>8||Math.abs(e.clientY-ly)>8)clr()});
mainEl.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("pointerdown",function(e){if(!pop.hidden&&!e.target.closest("#pop"))pop.hidden=true},true);
pop.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;pop.hidden=true;
 if(b.dataset.p==="copy"){var t=mainEl.textContent.replace(/,/g,"").replace("−","-");copyText(t).then(function(ok){toast(ok?"কপি হয়েছে":"কপি করা যায়নি")})}
 else if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(pasteNum,askPaste)}
 else askPaste();
});
document.addEventListener("paste",function(e){var t=(e.clipboardData||window.clipboardData).getData("text");if(t)pasteNum(t)});
</script>
</body>
</html>
