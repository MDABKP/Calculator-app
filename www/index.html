<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1c1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ক্যালকুলেটর</title>
<style>
:root{--bg:#1b1c1f;--panel:#2b2c30;--key:#3a3b40;--txt:#f4f4f4;--dim:#9a9ba0;--acc:#f5900a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:"Roboto","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.disp{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 22px 16px;background:var(--panel);border-radius:0 0 28px 28px}
.mem{height:30px;font-size:22px;color:var(--dim);white-space:nowrap;overflow:hidden}
.sub{text-align:right;white-space:nowrap;overflow-x:auto;overflow-y:hidden;font-size:30px;color:var(--dim);height:48px;line-height:40px;margin-top:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.sub::-webkit-scrollbar{display:none}
.main{text-align:right;white-space:nowrap;overflow-x:auto;overflow-y:hidden;font-size:76px;font-weight:500;line-height:1.15;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:9px;padding:12px 10px calc(12px);height:60%;box-sizing:border-box}
button{border:0;margin:0;padding:0;background:var(--key);color:var(--txt);font:inherit;font-size:34px;border-radius:16px;cursor:pointer}
button:active{filter:brightness(1.4)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:-3px}
.a{color:var(--acc)}
.m{font-size:28px;background:var(--m);color:var(--dim)}
.eq{background:var(--acc);color:#fff}
.tall{grid-row:span 2}
.main::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;height:36px;flex:none}
.top .mem{flex:1}
.hbtn{background:transparent;color:var(--dim);width:44px;height:36px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.hbtn.on{color:var(--acc)}
.hist{flex:1;min-height:0;overflow-y:auto;margin:4px -22px 6px;scrollbar-width:none;touch-action:pan-y}
.hist::-webkit-scrollbar{display:none}
.hw{position:relative;padding:0 16px 14px}
.hhd{position:sticky;top:0;z-index:3;display:block;box-sizing:border-box;height:62px;background:var(--panel);padding:0 2px}
.hhd b{font-size:15px;font-weight:600}
.hhd b span{font-size:13px;color:var(--dim);font-weight:400;margin-left:8px}
.hclr{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--m);color:#ff6b5e;border-radius:11px;border:1px solid var(--line);padding:0}
.hclr svg{width:16px;height:16px}
.hgl{position:relative;z-index:2;background:var(--panel);color:var(--acc);font-size:13px;font-weight:600;padding:10px 2px 8px;display:flex;align-items:center;gap:10px}
.hgl::after{content:"";flex:1;height:1px;background:var(--line)}
.hsw{position:relative;border-radius:14px;overflow:hidden;margin-bottom:8px;touch-action:pan-y}
.sdel{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:flex-end;padding:0 26px 0 0;background:#e8432e;color:#fff;border-radius:14px;opacity:0;transition:opacity .1s}
.sdel svg{width:24px;height:24px}
.ent{position:relative;background:var(--m);background:color-mix(in srgb,var(--txt) 15%,var(--panel));border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--txt) 22%,var(--panel));border-radius:14px;padding:7px 14px 8px;cursor:pointer;transition:transform .16s ease-out,opacity .22s ease}
.hsw.drag .ent{transition:none;will-change:transform}
.ent:active{filter:brightness(1.12)}
.hsw.rm{height:0!important;margin-bottom:0;opacity:0;transition:height .19s ease,margin .19s ease,opacity .19s ease}
.hsw.rm .ent{transform:translateX(-110%)!important;transition:transform .16s ease-in}
.hsw.clr .ent{transform:translateX(-110%)!important;opacity:0;transition:transform .26s ease-in,opacity .26s ease-in}
.hhd.fade,.hgl.fade{opacity:0;transition:opacity .22s ease}
@media (prefers-reduced-motion:reduce){.ent,.hsw.rm,.hsw.clr .ent{transition:none}}
.hm{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;font-weight:400;color:var(--dim);color:color-mix(in srgb,var(--txt) 72%,var(--m))}
.hm .t{opacity:1;flex:none;font-weight:400}
.hm .he{flex:1;min-width:0;text-align:right;font-size:16px;font-weight:500;color:var(--dim);color:color-mix(in srgb,var(--txt) 86%,var(--m));word-break:break-all}
.hr{text-align:right;font-size:22px;font-weight:700;color:var(--acc);word-break:break-all;line-height:1.2}
.hempty{padding:40px 30px;text-align:center;color:var(--dim)}
.hempty svg{display:block;width:44px;height:44px;margin:0 auto 10px;opacity:.5}
.hempty small{display:block;margin-top:4px;font-size:12px;opacity:.7}

button{transition:background .25s}
.flash{background:var(--acc)!important;color:#fff!important}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden],.pop[hidden]{display:none}
.card{width:100%;max-width:480px;background:var(--panel);border-radius:24px 24px 0 0;padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px))}
.card h3{margin:0 0 6px;font-weight:500}
.card label,.card .row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:17px;border-bottom:1px solid var(--line)}
.card input{width:22px;height:22px;accent-color:var(--acc)}
.sheet button{font-size:16px;padding:8px 14px;margin-left:6px;border-radius:12px}
.sheet button.on{background:var(--acc);color:#fff}
.card .throw{flex-wrap:wrap}
.thb{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:10px}
.thb button{margin:0!important;flex:1 1 auto;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px}
.td{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.7);flex:none;display:inline-block}
.sheet .thb button[data-th=dark]{background:#1b1c1f;color:#f4f4f4}
.sheet .thb button[data-th=light]{background:#eceef2;color:#17181b}
.sheet .thb button[data-th=amoled]{background:#000000;color:#ffffff}
.sheet .thb button[data-th=midnight]{background:#0d1426;color:#eaf1ff}
.sheet .thb button[data-th=cream]{background:#f3ecdf;color:#3b3226}
.sheet .thb button.on{box-shadow:inset 0 0 0 3px var(--acc)}
.sw{display:flex}
.sw button{width:30px;height:30px;padding:0;border-radius:50%;margin-left:8px;border:2px solid transparent}
.sw button.on{border-color:var(--txt)}
.sheet .card{max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .done{display:block;width:100%;margin:16px 0 0;background:var(--acc);color:#fff}
/* ===== সেটিংস নতুন নকশা ===== */
.setc{padding:0!important;display:flex;flex-direction:column;max-height:92vh}
.sheet .setc{overflow:hidden}
.shd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px 22px;flex:none}
.shd h3{margin:0;font-size:21px;font-weight:600}
.sheet .shd button{margin:0;width:38px;height:38px;padding:0;border-radius:50%;background:var(--m);color:var(--txt);display:flex;align-items:center;justify-content:center}
.shd button svg{width:18px;height:18px}
#s_close svg,#s_close svg *{pointer-events:none}
.sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh{font-size:13px;color:var(--acc);font-weight:600;padding:12px 8px 6px}

4 6h16M4 12h16M4 18h10"/></svg></span><span class="stx"><b>মেনুর অ্যানিমেশন</b></span><div class="seg wrap" id="mamo"><button data-ma="mix">মিশ্রণ (সুপারিশ)</button><button data-ma="pop">পপ</button><button data-ma="slide">স্লাইড</button><button data-ma="stagger">সারি ধরে</button><button data-ma="off">বন্ধ</button></div></div><div class="sr blk"><span class="si" style="background:linear-gradient(135deg,#a7acb8,#6b707c)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 12l4-3"/></svg></span><span class="stx"><b>মেনুর গতি</b></span><div class="seg" id="mkmo"><button data-mk="fast">দ্রুত</button><button data-mk="normal">স্বাভাবিক</button><button data-mk="slow">ধীর</button></div></div></div></div></div></div></div>

<script>
var expr="",lastExpr="",done=false,isErr=false,memory=0,histOpen=false,hist=[],MAXD=15;
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
var sm=parseFloat(load("calc_mem"));if(isFinite(sm))memory=sm;
function fmtNum(s){var p=s.split(".");p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");return p.join(".")}
function fmtExpr(e){return e.replace(/\d+\.?\d*|\.\d+/g,fmtNum).replace(/([+×÷−])/g," $1 ").replace(/([+×÷])\s+−\s+/g,"$1 −").replace(/\(\s*−/g,"(−").replace(/^\s*−\s*/,"−").trim()}
function plain(n){var s=String(n);if(!/e/i.test(s))return s;var m=s.match(/^(-?)(\d)(?:\.(\d+))?e([+-])(\d+)$/);if(!m)return null;var sg=m[1],d=m[2]+(m[3]||""),ex=+m[5];
  if(m[4]==="-")return sg+"0."+"0".repeat(ex-1)+d;
  if(ex>308)return null;return sg+d+"0".repeat(Math.max(0,ex-(d.length-1)))}
function fmtVal(n){if(!isFinite(n))return "ত্রুটি";var a=Math.abs(n);if(a>=1e15){return n.toExponential(14).replace(/\.?0+e/,"e").replace("e+","e").replace("-","−")}var s=plain(parseFloat(n.toPrecision(15)));return fmtNum(s).replace("-","−")}
function evalExpr(e){
  var t=e.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  var pm;while((pm=/(?<=[\d)])([+\-])(\d+\.?\d*|\.\d+)%(?![*\/])/.exec(t))){var L=t.slice(0,pm.index);t=t.slice(0,pm.index)+pm[1]+(L?"(("+L+")*"+pm[2]+"/100)":"("+pm[2]+"/100)")+t.slice(pm.index+pm[0].length)}
  t=t.replace(/(\d+\.?\d*|\.\d+|\))%/g,"($1/100)");
  t=t.replace(/(^|[^\d.])0+(?=\d)/g,"$1");
  t=t.replace(/[+\-*\/.(]+$/,"");
  if(!t||!/^[\d+\-*\/.()\s]+$/.test(t))return null;
  try{var v=Function('"use strict";return ('+t+')')();return typeof v==="number"?v:null}catch(err){return null}
}
function current(){var v=evalExpr(expr);return v===null?0:v}
function lastNum(){var m=expr.match(/\d+\.?\d*$|\.\d*$/);return m?m[0]:null}
function render(){
  document.getElementById("mem").textContent=memory!==0?"m "+fmtVal(memory):"";
  var sub=document.getElementById("sub"),main=document.getElementById("main");
  if(isErr){sub.textContent=fmtExpr(lastExpr);main.textContent="ত্রুটি"}
  else if(done){sub.textContent=lastExpr?fmtExpr(lastExpr)+" =":"";main.textContent=fmtVal(parseFloat(expr.replace("−","-")))}
  else{
    sub.textContent=expr===""?"":fmtExpr(expr);
    if(expr==="")main.textContent="0";
    else if(/^\d*\.?\d*$/.test(expr)){main.textContent=fmtNum(expr)}
    else{var v=evalExpr(expr);main.textContent=v===null?"0":fmtVal(v)}
  }
  fit();
}
function fitEl(el,max,min){var size=max;el.style.fontSize=size+"px";
  while(el.scrollWidth>el.clientWidth&&size>min){size-=1;el.style.fontSize=size+"px"}}
function fit(){var m=document.getElementById("main");fitEl(m,histOpen?56:76,36);m.scrollLeft=m.scrollWidth;var s=document.getElementById("sub");s.scrollLeft=s.scrollWidth}
function riseMain(){var m=document.getElementById("main");m.classList.remove("rise","rise2");void m.offsetWidth;m.classList.add("rise")}
function riseBack(){var m=document.getElementById("main");m.classList.remove("rise","rise2");void m.offsetWidth;m.classList.add("rise2")}
function press(k){
  var isOp=/^[+×÷−]$/.test(k);
  if(isErr){isErr=false;expr="";lastExpr="";done=false}
  if(done&&k==="="){if(S.rpe!==false)riseMain();return}
  if(done){if(/^[\d.]$/.test(k)||k==="mr")expr="";done=false}
  if(/^\d$/.test(k)&&!/%$/.test(expr)){var _l=lastNum();if(_l==="0")expr=expr.slice(0,-1)+k;else if(_l===null||_l.replace(".","").length<MAXD)expr+=k}
  else if(k==="."&&!/%$/.test(expr)){var ln=lastNum();if(ln===null||ln.indexOf(".")<0)expr+=(ln===null?"0.":".")}
  else if(isOp){
    if(expr===""){if(k==="−")expr="−"}
    else if(/[+×÷]−$/.test(expr)){if(k!=="−"&&expr.length>2)expr=expr.slice(0,-2)+k}
    else if(/[+×÷−]$/.test(expr)){if(k==="−"&&expr.slice(-1)!=="−")expr+=k;else if(expr.length>1||k==="−")expr=expr.slice(0,-1)+k}
    else expr+=k;
  }
  else if(k==="%"){if(/\d$/.test(expr))expr+="%"}
  else if(k==="C"){expr="";lastExpr="";isErr=false}
  else if(k==="back"){expr=expr.slice(0,-1);if(S.rpb!==false)riseBack()}
  else if(k==="="){var v=evalExpr(expr);if(v!==null&&/[+×÷−%]/.test(expr.replace(/^−/,""))){lastExpr=expr;var ps=isFinite(v)?plain(parseFloat(v.toPrecision(15))):null;if(ps===null){expr="";isErr=true;done=true}else{expr=ps.replace("-","−");done=true;addHist(lastExpr,expr);riseMain()}}else if(S.rpe!==false)riseMain()}
  else if(k==="mc"){memory=0;save("calc_mem",0)}
  else if(k==="m+"||k==="m-"){
    var _v=expr===""?null:evalExpr(expr);
    if(_v!==null&&isFinite(_v)){
      var _m=k==="m+"?memory+_v:memory-_v;
      if(isFinite(_m)){
        memory=parseFloat(_m.toPrecision(15));save("calc_mem",memory);
        if(!done){var _ps=plain(parseFloat(_v.toPrecision(15)));
          if(_ps!==null){
            if(/[+×÷−%]/.test(expr.replace(/^−/,""))){lastExpr=expr;addHist(lastExpr,_ps.replace("-","−"))}else lastExpr="";
            expr=_ps.replace("-","−");done=true;riseMain()}}
      }
    }
  }
  else if(k==="mr"){var s=plain(Math.abs(memory))||"0";var tn=expr.match(/\d+\.?\d*%?$|\.\d*$/);if(tn)expr=expr.slice(0,tn.index);expr+=memory<0?"−"+s:s}
  render();
}
try{hist=JSON.parse(load("calc_hist")||"[]")}catch(e){hist=[]}
if(!Array.isArray(hist))hist=[];
var CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
function hEsc(v){return String(v).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function addHist(e,r,x,u){var o={e:e,r:r,t:Date.now()};if(x)o.x=String(x).slice(0,80);if(u)o.u=String(u).slice(0,20);hist.push(o);if(hist.length>200)hist.shift();save("calc_hist",JSON.stringify(hist));if(histOpen)renderHist()}
function bnClock(d){var h=d.getHours(),m=d.getMinutes(),p=h<4?"রাত":h<6?"ভোর":h<12?"সকাল":h<15?"দুপুর":h<18?"বিকাল":h<20?"সন্ধ্যা":"রাত";return p+" "+(h%12||12)+":"+(m<10?"0":"")+m}
var TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
function dayLabel(d){
  var now=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var diff=Math.round((b-a)/864e5);
  if(diff===0)return "আজ";
  if(diff===1)return "গতকাল";
  return d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear();
}
function dayLabelY(d){var l=dayLabel(d);return (l==="আজ"||l==="গতকাল")?l:d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear()}
var selMode=false,selSet=new Set(),cfmAct="all";
var CLKI='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8l0 4l2 2"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>';
function hdrHtml(){
  var ico='<button class="hico" data-home="1" aria-label="ক্যালকুলেটরে ফিরুন">'+CLKI+'</button>',dt='<div class="hdt"><span class="hdl"></span>'+(selMode?'<span class="hgk"></span>':'')+'</div>';
  if(!selMode)return '<div class="hrow"><div class="hl">'+ico+'<b>আগের হিসাব<span>'+conv(hist.length)+' টি</span></b></div><button class="hclr" data-clr="1" aria-label="নির্বাচন করে মুছুন">'+TRASH+'</button></div>'+dt;
  var n=selSet.size;
  return '<div class="hrow"><div class="hl">'+ico+'<b><span style="margin:0;color:inherit;font-size:14px;font-weight:600">'+conv(n)+' টি নির্বাচিত</span></b><button class="hsb" data-sa="1">'+(n===hist.length?'বাদ':'সব')+'</button><button class="hsb" data-sx="1">বাতিল</button></div><button class="hclr hon'+(n?'':' hdim')+'" data-clr="1" aria-label="নির্বাচিত মুছুন">'+TRASH+(n?'<i class="hcnt">'+conv(n)+'</i>':'')+'</button></div>'+dt}
function grpSt(g){var h=document.getElementById("hist"),all=[].slice.call(h.querySelectorAll('.hsw[data-g="'+g+'"] .ent')),n=all.filter(function(e){return selSet.has(+e.dataset.i)}).length;return {sel:all.length>0&&n===all.length,part:n>0&&n<all.length}}
function enterSel(){if(!hist.length)return;selMode=true;selSet=new Set();keepScroll(renderHist)}
function exitSel(){if(!selMode)return;selMode=false;selSet=new Set();keepScroll(renderHist)}
function updSel(){var h=document.getElementById("hist");
  [].forEach.call(h.querySelectorAll(".hsw"),function(sw){var e=sw.querySelector(".ent");sw.classList.toggle("sel",!!e&&selSet.has(+e.dataset.i))});
  [].forEach.call(h.querySelectorAll(".hgl[data-g]"),function(g){var all=[].slice.call(h.querySelectorAll('.hsw[data-g="'+g.dataset.g+'"] .ent')),n=all.filter(function(e){return selSet.has(+e.dataset.i)}).length;
    g.classList.toggle("sel",all.length>0&&n===all.length);g.classList.toggle("part",n>0&&n<all.length)});
  var hd=h.querySelector(".hhd");if(hd){hd.innerHTML=hdrHtml();chipUpd()}}
function selToggle(i){if(selSet.has(i))selSet.delete(i);else selSet.add(i);updSel()}
function selGroup(g){var h=document.getElementById("hist"),ids=[].map.call(h.querySelectorAll('.hsw[data-g="'+g+'"] .ent'),function(e){return +e.dataset.i}),all=ids.every(function(i){return selSet.has(i)});
  ids.forEach(function(i){if(all)selSet.delete(i);else selSet.add(i)});updSel()}
function selAllToggle(){if(selSet.size===hist.length)selSet=new Set();else{selSet=new Set();for(var i=0;i<hist.length;i++)selSet.add(i)}updSel()}
function delSel(){var n=selSet.size;if(!n)return;cfmAct="sel";$("cfmt").textContent=n===hist.length?"সব হিসাব মুছবেন?":"নির্বাচিত হিসাব মুছবেন?";$("cfms").textContent=conv(n+"টি হিসাব মুছে যাবে। মুছে ফেলার পর কিছুক্ষণ ‘ফিরিয়ে আনুন’ বাটন পাবেন।");$("cfm").hidden=false;try{$("cfmn").focus()}catch(e){}}
function delSelNow(){var n=selSet.size;if(!n)return;
  if(n===hist.length){selMode=false;selSet=new Set();clearAllAnim();return}
  var idx=Array.from(selSet).sort(function(a,b){return a-b}),multi=idx.map(function(i){return {i:i,it:hist[i]}});
  selMode=false;selSet=new Set();
  keepScroll(function(){hist=hist.filter(function(_,i){return !multi.some(function(m){return m.i===i})});save("calc_hist",JSON.stringify(hist));renderHist()});
  showUndo(conv(n)+" টি হিসাব মুছে গেছে",{multi:multi})}
function renderHist(){
  var h=document.getElementById("hist"),s='<div class="hw">';
  if(!hist.length)s+='<div class="hempty">'+CLOCK+'এখনো কোনো হিসাব নেই<small>= চাপলে হিসাব এখানে জমা হবে</small></div>';
  else s+='<div class="hhd">'+hdrHtml()+'</div>';
  var lastKey="",open=false,gi=-1;
  hist.forEach(function(it,i){

var SWW=76,swEl=null,swX=0,swY=0,swBase=0,swDx=0,swLock=0,swOpen=null,swFired=false,delBusy=false,swLx=0,swLt=0,swV=0;
function reduceMo(){try{return window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches}catch(e){return false}}
function swClose(sw){if(!sw)return;sw.classList.remove("drag");var en=sw.querySelector(".ent"),dl=sw.querySelector(".sdel");if(en)en.style.transform="";if(dl)dl.style.opacity="";delete sw.dataset.open;if(swOpen===sw)swOpen=null}
$("hist").addEventListener("pointerdown",function(e){
 swFired=false;if(selMode||e.target.closest(".sdel"))return;
 var sw=e.target.closest(".hsw");
 if(swOpen&&swOpen!==sw)swClose(swOpen);
 if(!sw||delBusy)return;
 swEl=sw;swX=e.clientX;swY=e.clientY;swLock=0;swBase=sw.dataset.open?-SWW:0;swDx=swBase;swLx=e.clientX;swLt=e.timeStamp;swV=0});
$("hist").addEventListener("pointermove",function(e){
 if(!swEl)return;var dx=e.clientX-swX,dy=e.clientY-swY;
 if(!swLock){if(Math.abs(dx)>5&&Math.abs(dx)>Math.abs(dy)*1.1){swLock=1;swEl.classList.add("drag")}else if(Math.abs(dy)>7){swLock=2}}
 if(swLock!==1)return;swFired=true;
 var dt=e.timeStamp-swLt;if(dt>0){swV=.6*((e.clientX-swLx)/dt)+.4*swV;swLx=e.clientX;swLt=e.timeStamp}
 var x=Math.max(-SWW-24,Math.min(0,swBase+dx));swDx=x;
 swEl.querySelector(".ent").style.transform="translateX("+x+"px)";
 swEl.querySelector(".sdel").style.opacity=Math.min(1,-x/12)});
["pointerup","pointercancel"].forEach(function(t){$("hist").addEventListener(t,function(){
 if(!swEl)return;var sw=swEl;swEl=null;
 if(swLock!==1)return;
 sw.classList.remove("drag");
 var open=swDx<-SWW*.4||(swV<-.45&&swDx<-14);if(swV>.45)open=false;
 if(open){sw.querySelector(".ent").style.transform="translateX("+(-SWW)+"px)";sw.querySelector(".sdel").style.opacity="1";sw.dataset.open="1";swOpen=sw}
 else swClose(sw)})});

/* কি-বসা স্টার্টআপ অ্যানিমেশন: সব কি চারদিক থেকে উড়ে এসে একে একে জায়গায় বসে */
(function(){var h=document.documentElement,mode=h.getAttribute("data-intro");if(mode!=="keys"&&mode!=="bloom"&&mode!=="morph")return;
 var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
 function fin(){h.removeAttribute("data-intro");h.classList.remove("go");document.removeEventListener("pointerdown",fin,true)}
 if(rm){fin();return}
 var bs=[].slice.call(document.querySelectorAll(".pad button")),ord=bs.map(function(_,i){return i});
 if(mode==="bloom"){var pd=document.querySelector(".pad").getBoundingClientRect(),cx=pd.left+pd.width/2,cy=pd.top+pd.height/2;
  var ds=bs.map(function(b,i){var r=b.getBoundingClientRect();return{i:i,d:Math.hypot(r.left+r.width/2-cx,(r.top+r.height/2-cy)*.8)}}).sort(function(a,b){return a.d-b.d});
  ds.forEach(function(x,k){ord[x.i]=k})}
 else if(mode==="morph"){var ps=bs.map(function(b,i){var r=b.getBoundingClientRect();return{i:i,d:r.left+r.top*.9}}).sort(function(a,b){return a.d-b.d});
  ps.forEach(function(x,k){ord[x.i]=k})}
 else for(var i=ord.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=ord[i];ord[i]=ord[j];ord[j]=t}
 var W=window.innerWidth||360,H=window.innerHeight||700;
 bs.forEach(function(b,i){var sx=Math.random()<.5?-1:1,sy=Math.random()<.5?-1:1;
  b.style.setProperty("--o",ord[i]);
  if(mode==="morph"){b.setAttribute("data-mv",i%5);b.style.setProperty("--hu",[90,150,210,270,330][Math.floor(Math.random()*5)]+"deg")}
  if(mode!=="keys")return;
  b.style.setProperty("--dx",Math.round(sx*(W*.35+Math.random()*W*.5))+"px");
  b.style.setProperty("--dy",Math.round(sy*(H*.25+Math.random()*H*.45))+"px");
  b.style.setProperty("--r",Math.round(sx*(70+Math.random()*190))+"deg")});
 requestAnimationFrame(function(){h.classList.add("go")});
 var total=(mode==="bloom"?300+bs.length*30+750:mode==="morph"?300+bs.length*27+1000:350+bs.length*34+700);
 setTimeout(fin,total);
 document.addEventListener("pointerdown",fin,true);
})();

/* v10: history edge fade */
var hLast=0,hAcc=0;
function histFade(){var h=$("hist");if(!h||h.hidden)return;
 var hd=h.querySelector(".hhd"),gl=h.querySelector(".hgl"),mx=h.scrollHeight-h.clientHeight,st=h.scrollTop,hid=h.classList.contains("hh");
 h.style.setProperty("--ft",(hd?(hid?0:hd.offsetHeight)+(gl?gl.offsetHeight:0):0)+"px");
 h.style.setProperty("--ta",(hd&&st>2)?0:1);
 h.style.setProperty("--ba",st<mx-2?0:1);chipUpd()}
function chipUpd(){var h=document.getElementById("hist"),d=h&&h.querySelector(".hdt"),hd=h&&h.querySelector(".hhd");if(!d||!hd)return;
 var bt=hd.getBoundingClientRect().bottom,gs=h.querySelectorAll(".hgrp"),t="",gid=null;
 for(var i=0;i<gs.length;i++){if(gs[i].getBoundingClientRect().bottom>bt+2){var g=gs[i].querySelector(".hgl");if(g&&g.getBoundingClientRect().top<bt-2){t=g.dataset.l||"";gid=g.dataset.g}break}}
 var l=d.querySelector(".hdl");if(l)l.textContent=t?conv(t):"";
 if(t&&gid!==null){d.dataset.g=gid;if(selMode){var st=grpSt(gid);d.classList.toggle("sel",st.sel);d.classList.toggle("part",st.part)}}else{delete d.dataset.g;d.classList.remove("sel","part")}}
function hdrAuto(){histFade()}
var _rh2=renderHist;renderHist=function(){_rh2();var h=$("hist");if(h){h.classList.remove("hh");hLast=h.scrollTop;hAcc=0}histFade()};

window.addEventListener("resize",histFade);
